{% extends "base.html" %}
{% block tresc %}
<h1>Dodaj książkę</h1>
<form method="post">
    <p><label>Tytuł: <input type="text" name="tytul" required></label></p>
    <p><label>Cena: <input type="number" step="0.01" name="cena" required></label></p>
    <p><label>Rok wydania: <input type="number" name="rok_wydania"></label></p>
    <p>
        <label>Kategoria:
            <select name="kategoria_id">
                <option value="">-- Brak --</option>
                {% for kat in kategorie %}
                    <option value="{{ kat.id }}">{{ kat.nazwa }}</option>
                {% endfor %}
            </select>
        </label>
    </p>
    <p><label><input type="checkbox" name="dostepna" checked> Dostępna</label></p>
    <button type="submit">Zapisz</button>
</form>
{% endblock %}
